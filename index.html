<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div id="calculator">
        <div id="display">
            <div id="equation"></div>
            <div id="result"></div>
        </div>
        <div id="content">
            <button class="op" id="add">+</button>
            <button class="op" id="sub">-</button>
            <button class="op" id="mul">×</button>
            <button class="op" id="div">÷</button>
            <button class="head" id="ac">AC</button>

            <button id="equals">=</button>
            <button class="num" id="n3">3</button>
            <button class="num" id="n6">6</button>
            <button class="num" id="n9">9</button>
            <button class="head" id="ce">CE</button>

            <button id="decimal">.</button>
            <button class="num" id="n2">2</button>
            <button class="num" id="n5">5</button>
            <button class="num" id="n8">8</button>

            <button class="num" id="n0">0</button>
            <button class="num" id="n1">1</button>
            <button class="num" id="n4">4</button>
            <button class="num" id="n7">7</button>
        </div>
    </div>
</body>
</html>
